<!DOCTYPE html>
<html lang="es">

<body style="margin:0;padding:0;background:#f4f6f8;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;">
        <tr>
            <td align="center" style="padding:32px 16px;">

                <table role="presentation" width="600" cellspacing="0" cellpadding="0"
                    style="max-width:600px;width:100%;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e7ebef;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="background:#3F78A1;padding:28px 24px;">
                            <div
                                style="font-family:Segoe UI,Roboto,Arial,sans-serif;font-weight:800;font-size:34px;line-height:1;color:#ffffff;text-transform:uppercase;letter-spacing:1px;">
                                MyEvent
                            </div>

                            <!-- Cambia según el estado -->
                            <div
                                style="margin-top:10px;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:20px;line-height:1.3;color:#ffffff;font-weight:700;">
                                {{HEADER}}
                            </div>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="padding:28px;">
                            <p
                                style="margin:0 0 12px 0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:16px;color:#0b2537;">
                                Hola,
                            </p>

                            <p
                                style="margin:0 0 14px 0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:16px;color:#3a4b5a;">
                                El estado de tu evento <strong>"{{TITULO}}"</strong> ha sido actualizado.
                            </p>

                            <div
                                style="margin:20px 0;padding:18px;border-radius:10px;background:#f0f6fb;border:1px solid #d6e7f5;">
                                <p
                                    style="margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:17px;color:#0b2537;font-weight:700;text-align:center;">
                                    Estado: <span style="color:#3F78A1;">{{ESTADO_TEXTO}}</span>
                                </p>
                            </div>

                            <p
                                style="margin:0 0 20px 0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:15px;color:#3a4b5a;">
                                {{DESCRIPCION}}
                            </p>

                            <p
                                style="margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:14px;color:#566575;">
                                Si tienes dudas, comunícate con el administrador.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:16px 28px 28px 28px;border-top:1px solid #eef2f6;">
                            <p
                                style="margin:0 0 6px 0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:12px;color:#8a98a8;">
                                © {{YEAR}} MyEvent. Todos los derechos reservados.
                            </p>
                            <p
                                style="margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;font-size:12px;color:#8a98a8;">
                                Este es un mensaje automático, por favor no respondas a este correo.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>

</html>
